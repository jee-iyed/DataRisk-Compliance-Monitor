[project]
name = "datarisk-compliance-monitor"
version = "1.0.0"
description = "Couche de pilotage DSPM : consolidation, priorisation, remédiation, KPI/KRI et reporting (données fictives)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
