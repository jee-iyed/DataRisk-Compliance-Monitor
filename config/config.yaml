# =============================================================================================
# DataRisk Compliance Monitor — configuration unique (poids, seuils, SLA, périmètres)
# Toutes les valeurs sont des CHOIX documentés (cf. docs/DECISIONS.md), pas des normes.
# =============================================================================================

simulation:
  seed: 42
  start_date: "2026-08-31"      # lundi de la semaine 1
  weeks: 12
  campaign_weeks: [6, 7]        # campagne de remédiation à mi-période
  invalid_row_rate: 0.01        # lignes volontairement invalides injectées (test de la quarantaine)

entities:
  BQA: "Banque A"
  BQB: "Banque B"
  ASS: "Filiale Assurance"

perimeters:
  M365: "M365 / SharePoint"
  ONEDRIVE: "OneDrive"
  SMB: "Partages SMB"
  CLOUD: "Bucket cloud"
  SQLDB: "Bases SQL"
  GIT: "Dépôts de code"

# Périmètres qui DOIVENT être scannés (dénominateur du KPI de couverture)
scope:
  BQA: [M365, ONEDRIVE, SMB, CLOUD, SQLDB]
  BQB: [M365, ONEDRIVE, SMB, CLOUD, SQLDB]
  ASS: [M365, ONEDRIVE, SMB, CLOUD, SQLDB]

sources:
  dspm_vendor_a: "Éditeur DSPM A (export JSON)"
  dspm_vendor_b: "Éditeur DSPM B (export CSV)"
  datashield: "DataShield DSPM Lab (export SQLite/JSON)"

# Échelle commune : 1 Faible · 2 Moyenne · 3 Élevée · 4 Critique
severity_mapping:
  dspm_vendor_a: {info: 1, low: 1, medium: 2, high: 3, critical: 4}
  dspm_vendor_b: {"1": 1, "2": 1, "3": 2, "4": 3, "5": 4}
  datashield: {Faible: 1, Moyen: 2, Élevé: 3, Critique: 4}

# Connecteur DataShield : type de dépôt -> périmètre ; entité par défaut (DataShield n'a pas d'entité)
datashield:
  default_entity: BQA
  kind_to_perimeter: {smb: SMB, sharepoint: M365, onedrive: ONEDRIVE, s3: CLOUD, git: GIT}

# ---------------------------------------------------------------------------------------------
# Priorisation : score = 80 × sensibilité × exposition × volume  +  bonus   (borné à 100)
# ---------------------------------------------------------------------------------------------
scoring:
  base_points: 80
  classification: {C0: 0.10, C1: 0.35, C2: 0.70, C3: 0.90}
  rgpd_bonus: {aucune: 0.0, personnelle: 0.05, bancaire: 0.10, secret: 0.10, sensible_art9: 0.10}
  exposure: {public: 1.0, externe: 0.80, groupe_large: 0.55, restreint: 0.30}
  volume:
    min_factor: 0.6             # 1 enregistrement -> 0.6 ; >= reference_records -> 1.0 (échelle log)
    reference_records: 1000000
  bonus:
    unencrypted: 6              # appliqué seulement si classification >= C2
    prod_in_dev: 6
    non_eu: 5
    secret: 8
    corroborated: 5             # vu par >= 2 sources indépendantes
    age_per_week: 1             # persistance de la détection
    age_max: 5
  priorities: {P1: 60, P2: 45, P3: 28, P4: 0}   # seuils "score >="

sla_days: {P1: 2, P2: 7, P3: 30, P4: 90}

# Rétention des observations brutes dans la base (les incidents consolidés sont conservés)
retention:
  raw_alerts_days: 395

# ---------------------------------------------------------------------------------------------
# Seuils vert / orange / rouge
#   lower_is_better : valeur <= green -> vert ; <= amber -> orange ; sinon rouge
#   higher_is_better: valeur >= green -> vert ; >= amber -> orange ; sinon rouge
# ---------------------------------------------------------------------------------------------
thresholds:
  # KRI (niveau de risque)
  c3_exposed_public_external: {direction: lower_is_better, green: 2, amber: 8}
  unencrypted_personal_records: {direction: lower_is_better, green: 50000, amber: 250000}
  open_exposed_secrets: {direction: lower_is_better, green: 0, amber: 3}
  retention_exceeded: {direction: lower_is_better, green: 5, amber: 15}
  p1_over_sla: {direction: lower_is_better, green: 0, amber: 2}
  risk_index: {direction: lower_is_better, green: 15, amber: 25}
  # KPI (performance du dispositif)
  coverage_pct: {direction: higher_is_better, green: 95, amber: 80}
  sla_compliance_pct: {direction: higher_is_better, green: 90, amber: 75}
  fp_rate_pct: {direction: lower_is_better, green: 15, amber: 25}
  reopen_rate_pct: {direction: lower_is_better, green: 5, amber: 10}
